name: RescueCloud CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite & Security Validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest

    - name: Execute Pytest Suite
      env:
        JWT_SECRET_KEY: ci-test-cryptographic-secret-key-at-least-32-chars-long
        ADMIN_USERNAME: admin@rescuecloud.io
        ADMIN_PASSWORD: TestAdminSecurePassword2026!
        DOCTOR_USERNAME: doctor@rescuecloud.io
        DOCTOR_PASSWORD: TestDoctorSecurePassword2026!
      run: |
        pytest -v
