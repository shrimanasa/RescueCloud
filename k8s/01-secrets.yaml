# ===========================================================================
# LOCAL / MINIKUBE DEV ONLY — not applied by the production kustomization.
# Production uses 01-external-secrets.yaml (AWS Secrets Manager via IRSA).
# Keep this only if you need a quick local single-node k8s environment
# without an AWS account. Do not hand-edit real passwords into this file.
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: rescuecloud-secrets
  namespace: rescuecloud
type: Opaque
stringData:
  POSTGRES_USER: "rescueadmin"
  POSTGRES_PASSWORD: "REPLACE_WITH_GENERATED_POSTGRES_PASSWORD"
  POSTGRES_DB: "rescuecloud_ehr"
  MINIO_ROOT_USER: "rescueadmin"
  MINIO_ROOT_PASSWORD: "REPLACE_WITH_GENERATED_MINIO_PASSWORD"
  JWT_SECRET_KEY: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  ADMIN_USERNAME: "admin@rescuecloud.io"
  ADMIN_PASSWORD: "REPLACE_WITH_GENERATED_ADMIN_PASSWORD"
  BLOCKCHAIN_RPC_URL: "http://rescuecloud-blockchain:8545"
  BACKUP_LEDGER_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
