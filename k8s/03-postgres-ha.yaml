# CloudNativePG 3-node HA Postgres. 1Gi memory request, 2Gi limit.
# For >500 concurrent EHR sessions increase to 4Gi/8Gi and re-run load tests.
# ===========================================================================
# RescueCloud High-Availability PostgreSQL Cluster (CloudNativePG)
#
# Replaces single-node PostgreSQL with a resilient 3-instance cluster:
#   - 1 Primary (Read/Write) + 2 Standbys (Streaming Replication)
#   - Quorum-based automatic failover (<10s RTO)
#   - Synchronous replication: Zero data loss on single node failure
#   - Automated continuous WAL archiving to MinIO S3 bucket
#
# Prerequisite:
#   kubectl apply --server-side -f \
#     https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.22/releases/cnpg-1.22.0.yaml
# ===========================================================================
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rescuecloud-pg-ha
  namespace: rescuecloud
  labels:
    app.kubernetes.io/name: rescuecloud-pg-ha
    app.kubernetes.io/part-of: rescuecloud
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.2

  # Primary database configuration
  bootstrap:
    initdb:
      database: rescuecloud_ehr
      owner: rescueadmin
      secret:
        name: rescuecloud-secrets

  # PostgreSQL Runtime Parameters for Continuous Archiving & Zero-Loss
  postgresql:
    parameters:
      wal_level: "replica"
      archive_mode: "on"
      archive_timeout: "60s"
      max_wal_size: "10GB"
      min_wal_size: "1GB"
      shared_buffers: "512MB"
      synchronous_commit: "on"
    syncReplicaElectionConstraint:
      enabled: true
      minSyncReplicas: 1
      maxSyncReplicas: 2

  # Continuous WAL Backup to MinIO / S3 Object Storage
  backup:
    barmanObjectStore:
      destinationPath: s3://rescuecloud-backups/
      endpointURL: http://rescuecloud-minio:9000
      s3Credentials:
        accessKeyId:
          name: rescuecloud-secrets
          key: MINIO_ROOT_USER
        secretAccessKey:
          name: rescuecloud-secrets
          key: MINIO_ROOT_PASSWORD
      wal:
        compression: gzip
        maxParallel: 2

  # Storage Specification per Node
  storage:
    size: 20Gi

  # Health Probes and Resources
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

  # Service Endpoints generated automatically by CNPG:
  #   - rescuecloud-pg-ha-rw (Primary Read/Write)
  #   - rescuecloud-pg-ha-ro (Standby Read-Only Load Balanced)
  #   - rescuecloud-pg-ha-r  (Any instance Read-Only)
