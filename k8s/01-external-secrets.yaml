# ESO: IRSA exchanges pod OIDC token for short-lived AWS credentials.
# No static keys in the cluster. Prerequisites: AWS_DEPLOYMENT.md Step 2.
# SecretStore = auth to AWS. ExternalSecret = which keys to materialise as K8s Secret.
# ===========================================================================
# RescueCloud External Secrets Operator (ESO) Configuration — AWS
# Replaces plaintext/hand-edited Kubernetes secrets with dynamic sync from
# AWS Secrets Manager via IAM Roles for Service Accounts (IRSA) — no static
# AWS access keys stored anywhere in the cluster or in this repo.
#
# Prerequisites (see docs/AWS_DEPLOYMENT.md for the full sequence):
#   1. EKS cluster with an OIDC provider associated (eksctl or Terraform)
#   2. helm repo add external-secrets https://charts.external-secrets.io
#      helm install external-secrets external-secrets/external-secrets \
#        -n external-secrets --create-namespace
#   3. IAM role created (see docs/AWS_DEPLOYMENT.md for policy JSON) and
#      trusted to the OIDC provider, then bound to the ServiceAccount below
#      via `eksctl create iamserviceaccount` or an IRSA annotation.
#   4. Secrets actually created in AWS Secrets Manager at the paths referenced
#      below (rescuecloud/database, rescuecloud/minio, rescuecloud/auth,
#      rescuecloud/blockchain) — ESO reads them, it does not create them.
# ===========================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rescuecloud-eso-sa
  namespace: rescuecloud
  annotations:
    # Replace with the real IAM role ARN created in docs/AWS_DEPLOYMENT.md step 3.
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/rescuecloud-eso-role"
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: rescuecloud-aws-secrets-store
  namespace: rescuecloud
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1 # change to your chosen AWS region
      auth:
        jwt:
          serviceAccountRef:
            name: rescuecloud-eso-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rescuecloud-external-secrets
  namespace: rescuecloud
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: rescuecloud-aws-secrets-store
    kind: SecretStore
  target:
    name: rescuecloud-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: rescuecloud/database
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: rescuecloud/database
        property: password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: rescuecloud/database
        property: database_name
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: rescuecloud/minio
        property: root_user
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: rescuecloud/minio
        property: root_password
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: rescuecloud/auth
        property: jwt_secret_key
    - secretKey: ADMIN_USERNAME
      remoteRef:
        key: rescuecloud/auth
        property: admin_username
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: rescuecloud/auth
        property: admin_password
    - secretKey: BLOCKCHAIN_RPC_URL
      remoteRef:
        key: rescuecloud/blockchain
        property: rpc_url
    - secretKey: BACKUP_LEDGER_ADDRESS
      remoteRef:
        key: rescuecloud/blockchain
        property: contract_address

# End of external-secrets configuration.
