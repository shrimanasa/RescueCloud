# ===========================================================================
# RescueCloud Kubernetes Secrets Template
#
# DO NOT COMMIT PRODUCTION SECRETS TO VERSION CONTROL.
#
# Generate strong, random secrets for production:
#   POSTGRES_PASSWORD=$(openssl rand -base64 32)
#   MINIO_ROOT_PASSWORD=$(openssl rand -base64 32)
#   JWT_SECRET_KEY=$(openssl rand -hex 32)
#   ADMIN_PASSWORD=$(openssl rand -base64 24)
#
# Apply using kubectl command line:
#   kubectl create secret generic rescuecloud-secrets \
#     --namespace=rescuecloud \
#     --from-literal=POSTGRES_USER="rescueadmin" \
#     --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
#     --from-literal=POSTGRES_DB="rescuecloud_ehr" \
#     --from-literal=MINIO_ROOT_USER="rescueadmin" \
#     --from-literal=MINIO_ROOT_PASSWORD="${MINIO_ROOT_PASSWORD}" \
#     --from-literal=JWT_SECRET_KEY="${JWT_SECRET_KEY}" \
#     --from-literal=ADMIN_USERNAME="admin@yourhospital.org" \
#     --from-literal=ADMIN_PASSWORD="${ADMIN_PASSWORD}" \
#     --from-literal=BLOCKCHAIN_RPC_URL="https://your-rpc-node.provider.io" \
#     --from-literal=BACKUP_LEDGER_ADDRESS="0xYourDeployedContractAddress"
# ===========================================================================

apiVersion: v1
kind: Secret
metadata:
  name: rescuecloud-secrets
  namespace: rescuecloud
type: Opaque
stringData:
  POSTGRES_USER: "rescueadmin"
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_GENERATED_PASSWORD"
  POSTGRES_DB: "rescuecloud_ehr"
  MINIO_ROOT_USER: "rescueadmin"
  MINIO_ROOT_PASSWORD: "REPLACE_WITH_STRONG_GENERATED_PASSWORD"
  JWT_SECRET_KEY: "REPLACE_WITH_OPENSSL_RAND_HEX_32"
  ADMIN_USERNAME: "admin@yourhospital.org"
  ADMIN_PASSWORD: "REPLACE_WITH_STRONG_GENERATED_PASSWORD"
  BLOCKCHAIN_RPC_URL: "http://rescuecloud-blockchain:8545"
  BACKUP_LEDGER_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
