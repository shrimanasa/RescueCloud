# ─────────────────────────────────────────────────────────────
# EHR Core Service  (Port 8010)
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ehr-service
  namespace: rescuecloud
  labels:
    app: ehr-service
    agent: none
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ehr-service
  template:
    metadata:
      labels:
        app: ehr-service
    spec:
      containers:
      - name: ehr-service
        image: rescuecloud-services:latest
        imagePullPolicy: Never       # use locally-loaded image
        command: [uvicorn, services.ehr_service.main:app, --host, 0.0.0.0, --port, "8000"]
        envFrom:
        - configMapRef:
            name: rescuecloud-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rescuecloud-secrets
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ehr-service
  namespace: rescuecloud
spec:
  selector:
    app: ehr-service
  ports:
  - port: 8000
    targetPort: 8000
---
# ─────────────────────────────────────────────────────────────
# Threat Sentinel Agent  (Port 8020)
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-service
  namespace: rescuecloud
  labels:
    app: sentinel-service
    agent: threat-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-service
  template:
    metadata:
      labels:
        app: sentinel-service
        agent: threat-sentinel
    spec:
      containers:
      - name: sentinel-service
        image: rescuecloud-services:latest
        imagePullPolicy: Never
        command: [uvicorn, services.sentinel_service.main:app, --host, 0.0.0.0, --port, "8000"]
        envFrom:
        - configMapRef:
            name: rescuecloud-config
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rescuecloud-secrets
              key: POSTGRES_PASSWORD
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: v1
kind: Service
