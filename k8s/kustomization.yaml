# Apply order: Secrets -> Postgres HA -> App Deployment -> Ingress -> ServiceMonitor
# Run: kubectl apply -k k8s/   Verify: kubectl get all -n rescuecloud
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rescuecloud
resources:
  - 00-namespace.yaml
  - 01-external-secrets.yaml
  - 02-configmap.yaml
  - 03-postgres-ha.yaml
  - 04-redis.yaml
  - 05-minio.yaml
  - 06-microservices.yaml
  - 07-gateway.yaml
  - 08-frontend.yaml
  - 09-ingress.yaml
  - 09-cert-issuer.yaml
  - 10-monitoring.yaml
